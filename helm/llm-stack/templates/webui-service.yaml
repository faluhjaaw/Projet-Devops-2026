apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: {{ .Values.namespace }}
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: {{ .Values.openWebui.service.port }}
      targetPort: {{ .Values.openWebui.service.targetPort }}
      nodePort: {{ .Values.openWebui.service.nodePort }}
  type: NodePort
