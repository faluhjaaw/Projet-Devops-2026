apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: {{ .Values.namespace }}
  labels:
    app: open-webui
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.openWebui.replicas }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://ollama:{{ .Values.ollama.service.port }}; do
                echo "waiting for ollama..."; sleep 2;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: open-webui
          image: {{ .Values.openWebui.image }}
          ports:
            - name: http
              containerPort: {{ .Values.openWebui.service.targetPort }}
          envFrom:
            - configMapRef:
                name: open-webui-config
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources:
            {{- toYaml .Values.openWebui.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.openWebui.service.targetPort }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openWebui.service.targetPort }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openWebui.service.targetPort }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
