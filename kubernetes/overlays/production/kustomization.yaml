apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa-open-webui.yaml

patches:
  - path: patch-ollama-resources.yaml
  - path: patch-open-webui-resources.yaml
  - path: patch-ingress-host.yaml
  - path: patch-open-webui-pdb.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: true
